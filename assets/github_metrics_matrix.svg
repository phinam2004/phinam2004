<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="neon-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F77F00" />
      <stop offset="100%" stop-color="#FCBF49" />
    </linearGradient>
    <linearGradient id="neon-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#F4D06F" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#1B9AAA" />
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00B4D8" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes scanline {
      0% { transform: translateY(-480px); }
      100% { transform: translateY(480px); }
    }
    .hud-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 2px; fill: #00B4D8; }
    .hud-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; letter-spacing: 1px; }
    .metric-value { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 26px; fill: #FFFFFF; }
    .metric-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
    .lang-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #E2E8F0; }
    .lang-stat { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #94A3B8; }
    .blink { animation: pulse 2s infinite ease-in-out; }
    .card-box { fill: #0B132B; fill-opacity: 0.65; stroke: #1E293B; stroke-width: 1; rx: 10px; }
  </style>

  <!-- Background Base & Grid -->
  <rect width="950" height="480" rx="16" fill="url(#bg-grad)" stroke="#00B4D8" stroke-width="1.5" stroke-opacity="0.35" />
  <rect width="950" height="480" rx="16" fill="url(#grid)" />

  <!-- Corner Tech Accents -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" />
  <path d="M 934 35 L 934 16 L 915 16" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" />
  <path d="M 16 445 L 16 464 L 35 464" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" />
  <path d="M 934 445 L 934 464 L 915 464" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" />

  <!-- HUD Top Header -->
  <g transform="translate(30, 25)">
    <!-- Status Blinker -->
    <circle cx="6" cy="10" r="5" fill="#00B4D8" class="blink" filter="url(#glow)" />
    <circle cx="6" cy="10" r="2.5" fill="#FFFFFF" />
    <text x="24" y="15" class="hud-title">DK PHI NAM // CORE REPOSITORY TELEMETRY</text>
    <text x="890" y="15" text-anchor="end" class="hud-sub">STATUS: ONLINE • 74 REPOSITORIES LOADED</text>
    <line x1="0" y1="28" x2="890" y2="28" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Top Metrics Row (4 Cards) -->
  <g transform="translate(30, 70)">
    <!-- Card 1: Total Repositories -->
    <rect x="0" y="0" width="205" height="80" class="card-box" stroke="#00B4D8" stroke-opacity="0.4" />
    <text x="16" y="38" class="metric-value" fill="url(#cyan-glow)">74</text>
    <text x="16" y="58" class="metric-label">Public Repositories</text>
    <circle cx="175" cy="35" r="16" fill="#00B4D8" fill-opacity="0.1" />
    <path d="M 168 35 L 175 28 L 182 35 M 175 29 L 175 42" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Card 2: Total Code Volume -->
    <rect x="225" y="0" width="205" height="80" class="card-box" stroke="#06D6A0" stroke-opacity="0.4" />
    <text x="241" y="38" class="metric-value" fill="#06D6A0">1,041 MB</text>
    <text x="241" y="58" class="metric-label">Total Source Code</text>
    <circle cx="400" cy="35" r="16" fill="#06D6A0" fill-opacity="0.1" />
    <path d="M 393 32 L 400 28 L 407 32 L 407 40 L 400 44 L 393 40 Z" fill="none" stroke="#06D6A0" stroke-width="2" />

    <!-- Card 3: Commits -->
    <rect x="450" y="0" width="205" height="80" class="card-box" stroke="#FCBF49" stroke-opacity="0.4" />
    <text x="466" y="38" class="metric-value" fill="#FCBF49">218+</text>
    <text x="466" y="58" class="metric-label">Direct Commits</text>
    <circle cx="625" cy="35" r="16" fill="#FCBF49" fill-opacity="0.1" />
    <circle cx="625" cy="35" r="7" fill="none" stroke="#FCBF49" stroke-width="2" />
    <path d="M 618 35 L 610 35 M 632 35 L 640 35" stroke="#FCBF49" stroke-width="2" stroke-linecap="round" />

    <!-- Card 4: Architecture Fields -->
    <rect x="675" y="0" width="215" height="80" class="card-box" stroke="#B5179E" stroke-opacity="0.4" />
    <text x="691" y="38" class="metric-value" fill="#B5179E">4 Focuses</text>
    <text x="691" y="58" class="metric-label">Flutter • Web • Games • AI</text>
    <circle cx="860" cy="35" r="16" fill="#B5179E" fill-opacity="0.1" />
    <path d="M 853 35 L 860 30 L 867 35 L 860 40 Z" fill="none" stroke="#B5179E" stroke-width="2" />
  </g>

  <!-- Left Column: Real Language Breakdown (520px width) -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="520" height="275" class="card-box" />
    <text x="20" y="30" class="hud-title" font-size="13px">📊 REAL CODEBASE DISTRIBUTION (74 REPOSITORIES)</text>

    <!-- Language 1: JavaScript & Games -->
    <g transform="translate(20, 50)">
      <text x="0" y="12" class="lang-name">JavaScript &amp; HTML5 Games</text>
      <text x="480" y="12" text-anchor="end" class="lang-stat">31 Repos • 553.4 MB (41.9%)</text>
      <rect x="0" y="20" width="480" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="201" height="8" rx="4" fill="url(#neon-yellow)" />
    </g>

    <!-- Language 2: Python & AI -->
    <g transform="translate(20, 92)">
      <text x="0" y="12" class="lang-name">Python (AI &amp; Automation)</text>
      <text x="480" y="12" text-anchor="end" class="lang-stat">4 Repos • 197.5 MB (19.0%)</text>
      <rect x="0" y="20" width="480" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="91" height="8" rx="4" fill="url(#neon-blue)" />
    </g>

    <!-- Language 3: CSS & Web Styling -->
    <g transform="translate(20, 134)">
      <text x="0" y="12" class="lang-name">CSS3 &amp; Web Design</text>
      <text x="480" y="12" text-anchor="end" class="lang-stat">11 Repos • 119.1 MB (14.9%)</text>
      <rect x="0" y="20" width="480" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="71" height="8" rx="4" fill="url(#neon-purple)" />
    </g>

    <!-- Language 4: PHP & Laravel Full-Stack -->
    <g transform="translate(20, 176)">
      <text x="0" y="12" class="lang-name">PHP &amp; Laravel (Web Platforms)</text>
      <text x="480" y="12" text-anchor="end" class="lang-stat">5 Repos • 117.2 MB (11.2%)</text>
      <rect x="0" y="20" width="480" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="54" height="8" rx="4" fill="url(#neon-orange)" />
    </g>

    <!-- Language 5: Flutter & Dart Mobile -->
    <g transform="translate(20, 218)">
      <text x="0" y="12" class="lang-name">Flutter &amp; Dart (Cross-Platform Mobile)</text>
      <text x="480" y="12" text-anchor="end" class="lang-stat">6 Repos • Active Mobile Core</text>
      <rect x="0" y="20" width="480" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="63" height="8" rx="4" fill="url(#neon-green)" />
    </g>
  </g>

  <!-- Right Column: Engineering Capabilities & Architecture (355px width) -->
  <g transform="translate(570, 170)">
    <rect x="0" y="0" width="350" height="275" class="card-box" />
    <text x="20" y="30" class="hud-title" font-size="13px">⚡ DOMAIN PROFICIENCY RADAR</text>

    <!-- Capability 1 -->
    <g transform="translate(20, 52)">
      <text x="0" y="10" class="lang-name">Flutter &amp; Mobile UI/UX</text>
      <text x="310" y="10" text-anchor="end" class="lang-stat" fill="#00B4D8">95%</text>
      <rect x="0" y="18" width="310" height="6" rx="3" fill="#1E293B" />
      <rect x="0" y="18" width="295" height="6" rx="3" fill="url(#cyan-glow)" />
    </g>

    <!-- Capability 2 -->
    <g transform="translate(20, 94)">
      <text x="0" y="10" class="lang-name">Full-Stack Web (PHP / Laravel)</text>
      <text x="310" y="10" text-anchor="end" class="lang-stat" fill="#06D6A0">90%</text>
      <rect x="0" y="18" width="310" height="6" rx="3" fill="#1E293B" />
      <rect x="0" y="18" width="279" height="6" rx="3" fill="url(#neon-green)" />
    </g>

    <!-- Capability 3 -->
    <g transform="translate(20, 136)">
      <text x="0" y="10" class="lang-name">Interactive Canvas &amp; Games</text>
      <text x="310" y="10" text-anchor="end" class="lang-stat" fill="#FCBF49">88%</text>
      <rect x="0" y="18" width="310" height="6" rx="3" fill="#1E293B" />
      <rect x="0" y="18" width="272" height="6" rx="3" fill="url(#neon-yellow)" />
    </g>

    <!-- Capability 4 -->
    <g transform="translate(20, 178)">
      <text x="0" y="10" class="lang-name">AI &amp; Automation Integration</text>
      <text x="310" y="10" text-anchor="end" class="lang-stat" fill="#0077B6">85%</text>
      <rect x="0" y="18" width="310" height="6" rx="3" fill="#1E293B" />
      <rect x="0" y="18" width="263" height="6" rx="3" fill="url(#neon-blue)" />
    </g>

    <!-- Capability 5 -->
    <g transform="translate(20, 220)">
      <text x="0" y="10" class="lang-name">Cloud Backend &amp; Databases</text>
      <text x="310" y="10" text-anchor="end" class="lang-stat" fill="#B5179E">86%</text>
      <rect x="0" y="18" width="310" height="6" rx="3" fill="#1E293B" />
      <rect x="0" y="18" width="266" height="6" rx="3" fill="url(#neon-purple)" />
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(30, 460)">
    <text x="0" y="0" class="hud-sub">DK PHI NAM • VERIFIED GITHUB METRICS MATRIX</text>
    <text x="890" y="0" text-anchor="end" class="hud-sub">ENGINEERED FOR EXCELLENCE // 2026</text>
  </g>
</svg>